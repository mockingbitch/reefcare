openapi: 3.1.0
info:
  title: ReefCare API
  version: 0.1.0
  summary: Reef aquarium management API (Phase 1 — identity, profile, tanks).
  description: |
    Conventions are in docs/api-guidelines.md. In short:

    - JSON only, `snake_case`, timestamps RFC 3339 UTC, dates `YYYY-MM-DD`.
    - Decimal quantities are JSON **strings** (`"60"`, `"25.5"`) and are returned in canonical
      form (no trailing zeros). Values are never rounded: too many decimals is a 422.
    - `PATCH` bodies are merge patches over an explicit allowlist; `null` clears an optional
      field; unknown fields → 400 `unknown_field`. Contested resources require `version`.
    - Authentication is a session cookie (`__Host-rc_session`, or `rc_session` over plain http
      in development). Every authenticated non-GET request must send `X-CSRF-Token` (returned
      by login, also readable from the `__Host-rc_csrf` cookie). Every non-GET request whose
      `Origin` is not allowed, or that a browser marks `Sec-Fetch-Site: cross-site`, gets
      403 `csrf_failed`.
    - Signed-in users have a general budget of 120 state-changing requests per minute.
    - Resources the caller may not see return 404 `not_found`, never 403.

    This document must match the implementation: `internal/app/openapi_test.go` fails when a
    route exists in code but not here, or the reverse.
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: profile
  - name: tanks
  - name: water-changes
  - name: dosing
  - name: equipment
  - name: maintenance
  - name: livestock
  - name: water-parameters
  - name: notifications
  - name: knowledge
  - name: intelligence
  - name: scheduling

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /readyz:
    get:
      tags: [health]
      summary: Readiness (database reachable, schema at least the embedded version)
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: A dependency is not ready; only the failing check's name is shown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register (always 202, also for an already registered email)
      description: |
        Sends a verification link. To prevent enumeration the response is identical when the
        email already has an account; its owner is emailed instead. Rate limited per IP and per
        email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      summary: Verify an email address with the token from the link fragment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`invalid_token`: unknown, expired, used, or sent to an address the account no longer has."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Email a new verification link (3 per hour)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`already_verified`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in
      description: |
        Creates a session and sets the session and CSRF cookies. Unknown email and wrong
        password give the same 401 `invalid_credentials`. A suspended account gets 403
        `account_suspended` (only with the correct password). Signing in again revokes the
        previous session of this browser.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookies" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Sign out this session
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Signed out; cookies cleared. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/logout-all:
    post:
      tags: [auth]
      summary: Sign out every session of the account, including this one (audited)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: All sessions revoked; cookies cleared. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/password-reset/request:
    post:
      tags: [auth]
      summary: Request a password reset link (always 202)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Set a new password with a reset token; revokes every session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Password changed; email marked verified; cookies cleared. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/me:
    get:
      tags: [profile]
      summary: The signed-in account, profile, preferences and roles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [profile]
      summary: Update the profile (merge patch, `version` required)
      description: |
        Changing the timezone never changes stored timestamps. In `unit_prefs` and
        `notification_prefs` each key is merged; a `null` value removes that key, and `null`
        for the whole object resets it.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePatch" }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`version_conflict` or `username_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [profile]
      summary: Delete the account (requires the password)
      description: |
        Deactivates the account immediately, signs out every session, revokes pending email
        links and emails a confirmation. Personal data is erased or anonymized after 30 days
        (docs/security.md §9). Tanks of the account disappear from their viewers at once.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string }
      responses:
        "202":
          description: Deactivated; cookies cleared.
          content:
            application/json:
              schema:
                type: object
                required: [status, erase_after]
                properties:
                  status: { const: deactivated }
                  erase_after: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`validation_failed` with field `password` code `incorrect`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Busy" }
  /api/v1/me/password:
    post:
      tags: [profile]
      summary: Change password
      description: Revokes other sessions, rotates this session (new cookies and CSRF token) and emails a notification.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "200":
          description: Changed.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookies" }
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token]
                properties:
                  csrf_token: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Busy" }

  /api/v1/tanks:
    get:
      tags: [tanks]
      summary: List the caller's tanks, newest first
      parameters:
        - name: include
          in: query
          description: Comma-separated. `shared` adds tanks shared with the caller; `archived` adds archived tanks.
          schema: { type: string, example: "shared,archived" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of tanks.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tank" } }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tanks]
      summary: Create a private tank owned by the caller
      description: Records `tank.created` on the tank timeline. At most 100 tanks per owner.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TankCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tank" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`limit_reached`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/tanks/{tankID}:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [tanks]
      summary: Get a tank (owner or viewer)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tank" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tanks]
      summary: Update a tank (owner, merge patch, `version` required)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TankPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tank" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`forbidden` for viewers (they already know the tank exists); also `csrf_failed`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/tanks/{tankID}/archive:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    post:
      tags: [tanks]
      summary: Archive a tank (owner; terminal, idempotent)
      description: |
        Archived tanks stay readable but can no longer change. Records `tank.archived` on the
        timeline. Water-change schedules end and dosing plans complete, upcoming occurrences are
        removed, and water changes still open (including overdue ones) and still-scheduled doses
        are resolved as skipped with reason code `tank_archived`; missed doses stay missed.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: The archived tank.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tank" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/tanks/{tankID}/shares:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [tanks]
      summary: List who can view the tank (owner)
      responses:
        "200":
          description: At most 20 shares, never paginated.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Share" } }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [tanks]
      summary: Share the tank read-only by email or username (owner, verified email)
      description: |
        Rate limited (30 per hour per owner) because the answer reveals whether an account
        exists. The grantee's email is never returned. Audited as `tank.share.grant`.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Exactly one of `email` or `username`.
              properties:
                email: { type: string }
                username: { type: string }
      responses:
        "201":
          description: Shared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`email_not_verified`, `forbidden` (viewer) or `csrf_failed`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`duplicate` or `limit_reached` (20 shares)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`validation_failed`: field codes `exactly_one_of`, `required`, `grantee_not_found`, `cannot_share_with_self`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/tanks/{tankID}/shares/{userID}:
    parameters:
      - { $ref: "#/components/parameters/TankID" }
      - name: userID
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [tanks]
      summary: Revoke a share (owner), or leave a shared tank (the viewer themselves)
      description: Takes effect on the viewer's next request. Audited as `tank.share.revoke`.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/tanks/{tankID}/water-change-schedules:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [water-changes]
      summary: List the tank's water-change schedules (owner or viewer)
      responses:
        "200":
          description: All schedules of the tank, oldest first (never paginated).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WaterChangeSchedule" } }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [water-changes]
      summary: Create a recurring water-change schedule (owner)
      description: |
        Occurrences are created up to 35 days ahead at once and kept ahead by an hourly job;
        a new schedule never starts with overdue occurrences.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaterChangeScheduleCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterChangeSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/water-change-schedules/{scheduleID}:
    parameters:
      - name: scheduleID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [water-changes]
      summary: Edit, pause, resume or end a schedule (owner, merge patch, `version` required)
      description: |
        Changes to timing, volume, salt or status replace the upcoming occurrences nobody acted
        on. Overdue and resolved occurrences are history and stay. `ended` is terminal.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaterChangeSchedulePatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterChangeSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict`, `schedule_ended` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/tanks/{tankID}/water-changes:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [water-changes]
      summary: List water changes, newest event time first (owner or viewer)
      description: |
        Event time is `completed_at` for done changes, otherwise `scheduled_for`. A scheduled
        change past its grace (24 h, or half the schedule's spacing if shorter) is returned with
        `overdue: true` until the keeper completes or skips it. Field errors include
        `out_of_range` (before 2000-01-01) and `in_future`.
      parameters:
        - name: status
          in: query
          description: Comma-separated subset of `overdue`, `scheduled` (upcoming, not overdue), `completed`, `skipped`. Default all.
          schema: { type: string, example: "overdue,scheduled" }
        - name: from
          in: query
          description: Event time ≥ (RFC 3339)
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Event time < (RFC 3339)
          schema: { type: string, format: date-time }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of water changes.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WaterChange" } }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [water-changes]
      summary: Record a water change done without a schedule, or plan a one-time change (owner)
      description: Exactly one of `completed_at` (done; `actual_volume_l` required; added to the timeline) or `scheduled_for` (planned; `planned_volume_l` required).
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaterChangeRecord" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/water-changes/{eventID}/complete:
    parameters: [{ $ref: "#/components/parameters/WaterChangeID" }]
    post:
      tags: [water-changes]
      summary: Complete a scheduled (possibly overdue) water change (owner, idempotent)
      description: Repeating the same completion returns 200 with the stored change; a different completion or a skip after resolution is 409 `already_resolved`. Adds `water_change.completed` to the timeline.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actual_volume_l]
              properties:
                completed_at: { type: string, format: date-time, description: Default now; at most 5 min in the future. }
                actual_volume_l: { $ref: "#/components/schemas/Decimal" }
                salt_mix: { type: [string, "null"], maxLength: 100 }
                notes: { type: [string, "null"], maxLength: 2000 }
      responses:
        "200":
          description: Completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_resolved` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/water-changes/{eventID}/skip:
    parameters: [{ $ref: "#/components/parameters/WaterChangeID" }]
    post:
      tags: [water-changes]
      summary: Skip a scheduled (possibly overdue) water change with a reason (owner, idempotent)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Skipped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_resolved` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/dosing-products:
    get:
      tags: [dosing]
      summary: The curated catalog and the caller's own products
      responses:
        "200":
          description: Curated products first, then the caller's (never paginated).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DosingProduct" } }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [dosing]
      summary: Create a private product (at most 200)
      description: No concentration is stored or inferred; ReefCare records amounts only.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, form, default_unit]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                brand: { type: [string, "null"], maxLength: 100 }
                form: { $ref: "#/components/schemas/DosingForm" }
                default_unit: { $ref: "#/components/schemas/DoseUnit" }
                notes: { type: [string, "null"], maxLength: 2000 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DosingProduct" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`limit_reached`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/tanks/{tankID}/dosing-plans:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [dosing]
      summary: List the tank's dosing plans (owner or viewer)
      responses:
        "200":
          description: All plans, oldest first (never paginated).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DosingPlan" } }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [dosing]
      summary: Create a recurring dosing plan (owner)
      description: Occurrences are created 7 days ahead at once and kept ahead by an hourly job.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DosingPlanCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DosingPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`validation_failed`; field codes include `product_not_found`, `incompatible_unit`, `invalid_rrule`, `unsupported_rrule_part`, `before_start`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/dosing-plans/{planID}:
    parameters: [{ $ref: "#/components/parameters/DosingPlanID" }]
    patch:
      tags: [dosing]
      summary: Edit a plan (owner, merge patch, `version` required)
      description: Changes to amount, unit or timing replace upcoming occurrences nobody acted on; missed and resolved doses stay.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DosingPlanPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DosingPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict`, `plan_completed` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/dosing-plans/{planID}/pause:
    parameters: [{ $ref: "#/components/parameters/DosingPlanID" }]
    post:
      tags: [dosing]
      summary: Pause a plan (upcoming occurrences are removed; idempotent)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DosingPlan" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`plan_completed` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/dosing-plans/{planID}/resume:
    parameters: [{ $ref: "#/components/parameters/DosingPlanID" }]
    post:
      tags: [dosing]
      summary: Resume a paused plan (occurrences are created again from now; idempotent)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DosingPlan" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`plan_completed` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/dosing-plans/{planID}/complete:
    parameters: [{ $ref: "#/components/parameters/DosingPlanID" }]
    post:
      tags: [dosing]
      summary: Complete a plan for good (upcoming occurrences are removed; terminal)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DosingPlan" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`plan_completed` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/tanks/{tankID}/dosing-history:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [dosing]
      summary: Dose events, newest event time first (owner or viewer)
      description: Event time is `executed_at` when dosed, else `scheduled_for`.
      parameters:
        - name: status
          in: query
          description: Comma-separated subset of `scheduled`, `completed`, `partial`, `skipped`, `failed`, `missed`, `unconfirmed`. Default all.
          schema: { type: string, example: "missed,scheduled" }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of dose events.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DoseEvent" } }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tanks/{tankID}/dosing-events:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    post:
      tags: [dosing]
      summary: Record a dose given without a plan (owner; idempotent with Idempotency-Key)
      description: |
        With `Idempotency-Key`, a retry returns the first dose (header `Idempotent-Replayed: true`)
        instead of creating a duplicate; the same key with a different request is 422
        `idempotency_key_reused`. Adds `dosing.completed` to the timeline.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [product_id, amount, amount_unit]
              properties:
                product_id: { type: string, format: uuid }
                amount: { $ref: "#/components/schemas/Decimal" }
                amount_unit: { $ref: "#/components/schemas/DoseUnit" }
                executed_at: { type: string, format: date-time, description: Default now; not in the future. }
                notes: { type: [string, "null"], maxLength: 2000 }
      responses:
        "201":
          description: Recorded (or replayed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoseEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`validation_failed` or `idempotency_key_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/dosing-events/{eventID}/resolve:
    parameters:
      - name: eventID
        in: path
        required: true
        description: A malformed ID is answered like an unknown one (404).
        schema: { type: string, format: uuid }
    post:
      tags: [dosing]
      summary: Record what happened to a scheduled, missed or unconfirmed dose (owner, idempotent)
      description: |
        - `completed`: the planned amount was given (`actual_amount` defaults to it, stored with
          `actual_source: planned_default`); less is `partial` (`use_partial`); more than 1.5× the
          planned amount needs `confirm_over_planned: true` (`confirm_over_planned`).
        - `partial`: `actual_amount` required and less than planned.
        - `skipped` / `failed`: `reason` required; `failed` may record the amount that went in.
        - A missed or unconfirmed dose resolved as given needs an explicit `executed_at`
          (`required_for_late_dose`): was it given on time and not logged, or late? Never
          defaulted to now. `executed_at` may not be more than a day before the scheduled time.
        Repeating the same outcome returns 200; a different one 409 `already_resolved`. Adds
        `dosing.<status>` to the timeline; resolving a missed/unconfirmed dose carries
        `previous_status` and `corrected_at` in its summary.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { enum: [completed, partial, skipped, failed] }
                actual_amount: { $ref: "#/components/schemas/Decimal" }
                executed_at: { type: string, format: date-time, description: "completed/partial only; default now unless the dose is missed/unconfirmed." }
                confirm_over_planned: { type: boolean, default: false }
                reason: { type: [string, "null"], maxLength: 500 }
                notes: { type: [string, "null"], maxLength: 2000 }
      responses:
        "200":
          description: Resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoseEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_resolved` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/tanks/{tankID}/equipment:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [equipment]
      summary: The tank's devices, newest installation first (owner or viewer)
      parameters:
        - name: include
          in: query
          description: "`removed` adds removed devices."
          schema: { enum: [removed] }
      responses:
        "200":
          description: All devices (never paginated; at most 200 per tank).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Equipment" } }
                  next_cursor: { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [equipment]
      summary: Add a device (owner); records `equipment.installed` on the timeline
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentCreate" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived` or `limit_reached`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/equipment/{equipmentID}:
    parameters: [{ $ref: "#/components/parameters/EquipmentID" }]
    get:
      tags: [equipment]
      summary: A device with its current configuration (owner or viewer)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [equipment]
      summary: Edit a device that is still installed (owner, merge patch, `version` required)
      description: "`installed_at` is fixed at creation (the timeline is placed against it)."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict`, `equipment_removed` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/equipment/{equipmentID}/remove:
    parameters: [{ $ref: "#/components/parameters/EquipmentID" }]
    post:
      tags: [equipment]
      summary: Mark a device removed (owner; idempotent)
      description: The device stays in history; its maintenance plans stop being due. Records `equipment.removed`.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                removed_at: { type: string, format: date-time, description: Default now; not before installed_at. }
                reason: { type: [string, "null"], maxLength: 500 }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/equipment/{equipmentID}/configurations:
    parameters: [{ $ref: "#/components/parameters/EquipmentID" }]
    get:
      tags: [equipment]
      summary: Every configuration version, newest first (owner or viewer)
      responses:
        "200":
          description: All versions (never paginated).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EquipmentConfiguration" } }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [equipment]
      summary: Record a new configuration version (owner)
      description: Versions are immutable; earlier ones stay visible. Records `equipment.configuration_changed` at `effective_at`.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [settings]
              properties:
                settings: { $ref: "#/components/schemas/EquipmentSettings" }
                effective_at:
                  type: string
                  format: date-time
                  description: |
                    Default now; not in the future, not before installed_at (`before_installed`) and
                    not before the current version's effective_at (`before_current`), so the latest
                    version is always the current one.
                note: { type: [string, "null"], maxLength: 500 }
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EquipmentConfiguration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`equipment_removed` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/tanks/{tankID}/maintenance-plans:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [maintenance]
      summary: Maintenance plans, active and soonest due first (owner or viewer)
      responses:
        "200":
          description: All plans (never paginated; at most 100 per tank).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MaintenancePlan" } }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [maintenance]
      summary: Create a maintenance plan (owner); first due on `starts_on`
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenancePlanCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenancePlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived` or `limit_reached`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/maintenance-plans/{planID}:
    parameters: [{ $ref: "#/components/parameters/MaintenancePlanID" }]
    patch:
      tags: [maintenance]
      summary: Edit a plan (owner, merge patch, `version` required); the due date is recomputed
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenancePlanPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenancePlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/maintenance-plans/{planID}/events:
    parameters: [{ $ref: "#/components/parameters/MaintenancePlanID" }]
    post:
      tags: [maintenance]
      summary: Record that a plan's task was done (owner; idempotent with Idempotency-Key)
      description: |
        The plan becomes due `interval_days` after the latest performance (local date in the
        plan's zone); recording an older one late never moves it back. An inactive plan may still
        be recorded. Records `maintenance.performed`.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                performed_at: { type: string, format: date-time, description: Default now; not in the future. }
                notes: { type: [string, "null"], maxLength: 2000 }
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/tanks/{tankID}/maintenance-events:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [maintenance]
      summary: Maintenance done, newest first (owner or viewer)
      parameters:
        - { name: plan_id, in: query, schema: { type: string, format: uuid } }
        - { name: equipment_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of maintenance events.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MaintenanceEvent" } }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [maintenance]
      summary: Record maintenance done without a plan (owner; idempotent with Idempotency-Key)
      description: |
        With `equipment_id`, `performed_at` must fall within the device's lifetime
        (`before_installed`, `after_removed`); past work on a removed device may be recorded.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
                equipment_id: { type: [string, "null"], format: uuid }
                performed_at: { type: string, format: date-time }
                notes: { type: [string, "null"], maxLength: 2000 }
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/parameter-types:
    get:
      tags: [water-parameters]
      summary: The parameter catalog with accepted units, hard bounds and default freshness (signed in)
      description: |
        PROVISIONAL until decision D5 (open item L3): conversions, bounds and freshness windows
        await review by the named domain reviewer. Units marked `estimate` convert with an
        assumption (specific gravity is read as 25/25 °C); readings entered with them are flagged.
      responses:
        "200":
          description: All system parameters in display order (never paginated).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ParameterType" } }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/tanks/{tankID}/water-tests:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [water-parameters]
      summary: Water tests, newest measured first, with every reading incl. superseded ones (owner or viewer)
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: parameter, in: query, description: Only tests with a valid reading of this parameter., schema: { type: string } }
        - { name: from, in: query, description: "Inclusive lower bound on `measured_at` (RFC 3339).", schema: { type: string, format: date-time } }
        - { name: to, in: query, description: "Exclusive upper bound on `measured_at` (RFC 3339).", schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WaterTest" } }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [water-parameters]
      summary: Record a water test with one reading per parameter (owner; idempotent with Idempotency-Key)
      description: |
        Each value is kept as entered (value + unit) and converted exactly to the parameter's
        canonical unit. Values outside the hard bounds are rejected (`out_of_range` with
        `min`, `max`, `unit`); likely unit mistakes are accepted and returned as `warnings`
        for the client to confirm. Records a `measurement.recorded` timeline event.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaterTestCreate" }
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterTest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/tanks/{tankID}/water-tests/latest:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [water-parameters]
      summary: The newest valid reading of every catalog parameter, with freshness and current target (owner or viewer)
      responses:
        "200":
          description: One item per catalog parameter in display order; `reading` is null if never measured.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LatestReading" } }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tanks/{tankID}/water-tests/trends:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [water-parameters]
      summary: Valid readings over time per parameter, target history and event annotations (owner or viewer)
      parameters:
        - { name: parameters, in: query, required: true, description: Comma-separated parameter codes., schema: { type: string }, example: "alkalinity,calcium" }
        - { name: from, in: query, description: "Inclusive; default `to` − 90 days (RFC 3339).", schema: { type: string, format: date-time } }
        - { name: to, in: query, description: "Exclusive; default now + 5 minutes (readings may be up to 5 minutes ahead of the server clock) (RFC 3339). At most 732 days after `from`.", schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trends" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tanks/{tankID}/parameter-targets:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [water-parameters]
      summary: The tank's current targets (owner or viewer)
      responses:
        "200":
          description: Current targets in catalog order (never paginated).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [water-parameters]
      summary: Replace the tank's targets (owner)
      description: |
        The request lists every target the tank should have. Changed targets close the current
        version and start a new one; targets left out are closed. History is kept, so past
        readings stay compared with the target valid when they were measured. Values are in the
        canonical unit.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targets]
              properties:
                targets:
                  type: array
                  description: Required; `[]` removes every target.
                  maxItems: 10
                  items: { $ref: "#/components/schemas/TargetInput" }
      responses:
        "200":
          description: The current targets after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/water-tests/{testID}:
    parameters:
      - { name: testID, in: path, required: true, description: A malformed ID is answered like an unknown one (404)., schema: { type: string, format: uuid } }
    get:
      tags: [water-parameters]
      summary: One water test with all its readings (owner or viewer)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterTest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/readings/{readingID}/corrections:
    parameters:
      - { name: readingID, in: path, required: true, description: A malformed ID is answered like an unknown one (404)., schema: { type: string, format: uuid } }
    post:
      tags: [water-parameters]
      summary: Correct a reading (owner); the old reading is kept as `superseded`
      description: |
        Readings are never edited. A correction inserts a new valid reading of the same
        parameter, test and time with a required `reason`, and records a
        `measurement.corrected` timeline event. Not idempotent: a retry after a lost response
        is answered `already_superseded`; reload the test to see the correction.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value, unit, reason]
              properties:
                value: { $ref: "#/components/schemas/Decimal" }
                unit: { type: string }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: The new reading.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reading" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_superseded` (correct the newest reading) or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/species:
    get:
      tags: [livestock]
      summary: Search curated and own species by name (signed in)
      parameters:
        - { name: q, in: query, description: "Substring of a Vietnamese, English or scientific name (case-insensitive).", schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/LivestockCategory" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Curated species first, then your own (never paginated).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Species" } }
                  next_cursor: { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [livestock]
      summary: Add a private species, usable only on your tanks
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpeciesCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Species" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`limit_reached` (500 own species)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/tanks/{tankID}/livestock:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [livestock]
      summary: The tank's livestock, newest first (owner or viewer)
      parameters:
        - name: include
          in: query
          description: "`gone` adds groups whose quantity reached 0."
          schema: { enum: [gone] }
      responses:
        "200":
          description: All entries (never paginated; at most 500 per tank).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LivestockEntry" } }
                  next_cursor: { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [livestock]
      summary: Add livestock (owner; idempotent with Idempotency-Key); records an `added` event
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LivestockEntryCreate" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LivestockEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived` or `limit_reached` (500 present groups, 5000 entries ever)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/livestock/{entryID}:
    parameters: [{ $ref: "#/components/parameters/LivestockEntryID" }]
    get:
      tags: [livestock]
      summary: One entry (owner or viewer)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LivestockEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [livestock]
      summary: Edit an entry's description (owner, merge patch, `version` required)
      description: |
        The quantity changes only through events and reconciliation; `version` covers the
        description and is not bumped by events.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LivestockEntryPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LivestockEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`version_conflict` or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/livestock/{entryID}/events:
    parameters: [{ $ref: "#/components/parameters/LivestockEntryID" }]
    get:
      tags: [livestock]
      summary: The entry's history, newest first (owner or viewer)
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LivestockEvent" } }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [livestock]
      summary: Record an event (owner; idempotent with Idempotency-Key)
      description: |
        Quantity events take a positive `quantity`:
        arrivals `added` (from outside), `transferred_in` (from another tank), `propagated`
        (fragging, splitting, reproduction in the system), `found` (a missing animal turned up);
        losses `died` (seen), `missing` (fate unknown — never treated as a death),
        `transferred_out` (moved, rehomed, traded, returned), `sold`.
        Observations (`health_observation`, `treatment`) take a `note` and no quantity.
        `occurred_at` may be in the past but not before the entry was added (422 `before_added`).
        No running balance may leave 0..100000 in event order, also for a late, backdated event
        (409 `quantity_underflow` / `quantity_overflow`). History is never edited: correct a
        count with `/reconcile`. ReefCare records observations; it does not diagnose.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type]
              properties:
                type: { enum: [added, transferred_in, propagated, found, died, missing, transferred_out, sold, health_observation, treatment] }
                quantity: { type: integer, minimum: 1, maximum: 10000 }
                occurred_at: { type: string, format: date-time, description: Default now; not in the future. }
                note: { type: [string, "null"], maxLength: 2000 }
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LivestockEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`quantity_underflow`, `quantity_overflow`, `limit_reached` (2000 quantity events or 5000 observations per entry) or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/livestock/{entryID}/reconcile:
    parameters: [{ $ref: "#/components/parameters/LivestockEntryID" }]
    post:
      tags: [livestock]
      summary: Set the actual count (owner)
      description: |
        Records a `reconciliation` event with the difference between `count` and the balance at
        `occurred_at`; earlier events are kept. A count equal to that balance records nothing.
        Send `Idempotency-Key` (or the same `occurred_at`) when retrying: a retry without either
        reconciles again at the new time. `occurred_at` before the entry was added is 422
        `before_added`.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [count]
              properties:
                count: { type: integer, minimum: 0, maximum: 100000 }
                occurred_at: { type: string, format: date-time, description: Default now; not before the entry was added. }
                note: { type: [string, "null"], maxLength: 2000 }
      responses:
        "200":
          description: The entry after reconciling.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LivestockEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`quantity_underflow` (a later event would drop below zero), `quantity_overflow`, `limit_reached` (2000 quantity events) or `tank_archived`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/tanks/{tankID}/timeline:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [tanks]
      summary: The tank's unified timeline, newest first (owner or viewer)
      description: |
        Everything recorded on the tank (tank changes, dosing, water changes, equipment,
        maintenance, livestock…) at the time it happened (`occurred_at`), not when it was
        entered. `summary` holds render-ready parameters; clients localize by `event_type` and
        should show unknown types generically. Render times in the user's time zone.
      parameters:
        - name: category
          in: query
          description: Comma-separated or repeated; an unknown category is 400 `invalid_query` (`unsupported`).
          schema: { type: array, items: { $ref: "#/components/schemas/TimelineCategory" } }
          style: form
          explode: false
        - { name: from, in: query, description: Inclusive (RFC 3339)., schema: { type: string, format: date-time } }
        - { name: to, in: query, description: "Exclusive (RFC 3339); not before `from` (400 `before_from`).", schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TimelineEvent" } }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: Your notifications, newest first
      description: |
        Reminders created by a scan every 15 minutes: missed doses, water changes coming up
        (within a day) or overdue, maintenance due today or overdue — once per occurrence.
        Only the tank owner is reminded. Clients localize by `kind` with `payload`; unknown
        kinds should render generically. Read notifications are kept 90 days, others 180.
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of notifications.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/notifications/unread-count:
    get:
      tags: [notifications]
      summary: How many notifications are unread (capped at 100)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count, capped]
                properties:
                  count: { type: integer, minimum: 0, maximum: 100 }
                  capped: { type: boolean, description: "True when there are 100 or more (show \"99+\")." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark every notification read
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Done. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/notifications/{notificationID}/read:
    parameters:
      - name: notificationID
        in: path
        required: true
        description: Another user's (or a malformed) ID is answered like an unknown one (404).
        schema: { type: string, format: uuid }
    post:
      tags: [notifications]
      summary: Mark one notification read (idempotent)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Done. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/recurrence/preview:
    get:
      tags: [scheduling]
      summary: Preview the next occurrences of a schedule before saving it
      description: |
        Applies exactly the rules used when a water-change schedule or dosing plan is saved,
        so clients can show "next: Sun 1 Nov, Sun 8 Nov, …" without reimplementing them.
        Stores nothing. Field errors are the same as on schedule creation (`invalid_rrule`,
        `unsupported_rrule_part`, `invalid_timezone`, `invalid_date`, `out_of_range`,
        `before_start`).
      parameters:
        - { name: rrule, in: query, required: true, schema: { $ref: "#/components/schemas/RRule" } }
        - { name: timezone, in: query, required: true, description: IANA time zone of the wall-clock times, schema: { type: string } }
        - { name: starts_on, in: query, required: true, schema: { type: string, format: date } }
        - { name: ends_on, in: query, description: Inclusive; not before starts_on., schema: { type: string, format: date } }
      responses:
        "200":
          description: Canonical rule and up to 3 occurrences at or after now (empty when the window has passed).
          content:
            application/json:
              schema:
                type: object
                required: [rrule, next_occurrences]
                properties:
                  rrule: { $ref: "#/components/schemas/RRule" }
                  next_occurrences: { type: array, maxItems: 3, items: { type: string, format: date-time } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/knowledge:
    get:
      tags: [knowledge]
      summary: Published knowledge articles (signed in)
      description: The live version of each article in `locale`, else in the other locale.
      parameters:
        - { name: locale, in: query, schema: { enum: [vi, en], default: vi } }
        - { name: parameter, in: query, description: Comma-separated or repeated parameter codes., schema: { type: array, items: { type: string } }, style: form, explode: false }
        - { name: q, in: query, description: Substring of the title or summary., schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Live articles (never paginated; at most 500).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/KnowledgeVersion" } }
                  next_cursor: { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/knowledge/{slug}:
    parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
    get:
      tags: [knowledge]
      summary: A published article with its body, structured lists and sources (signed in)
      parameters:
        - { name: locale, in: query, schema: { enum: [vi, en], default: vi } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeVersion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/knowledge/sources:
    get:
      tags: [knowledge]
      summary: Every source
      description: Editors only (role `administrator`); others get 403. 
      responses:
        "200":
          description: All sources (at most 1000).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/KnowledgeSource" } }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [knowledge]
      summary: Add a source
      description: Editors only (role `administrator`); others get 403. Only real, checkable sources; never generated. `url` must be https; a URL or a publisher is required.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeSourceCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/knowledge/articles:
    get:
      tags: [knowledge]
      summary: Every article with each locale's newest version
      description: Editors only (role `administrator`); others get 403. 
      responses:
        "200":
          description: All articles.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/KnowledgeArticle" } }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [knowledge]
      summary: Create an article
      description: Editors only (role `administrator`); others get 403. 
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, category]
              properties:
                slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }
                category: { $ref: "#/components/schemas/KnowledgeCategory" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeArticle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`slug_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/knowledge/articles/{articleID}/retire:
    parameters: [{ name: articleID, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [knowledge]
      summary: Withdraw an article
      description: Editors only (role `administrator`); others get 403. Its live versions are retired and readers no longer see it; assessments keep citing the versions they used. Audited.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Withdrawn. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/knowledge/articles/{articleID}/versions:
    parameters: [{ name: articleID, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [knowledge]
      summary: Every version of an article (without bodies)
      description: Editors only (role `administrator`); others get 403. 
      responses:
        "200":
          description: All versions, per locale newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/KnowledgeVersion" } }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [knowledge]
      summary: Start a draft version in a locale
      description: Editors only (role `administrator`); others get 403. 
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeVersionInput" }
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`article_retired`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/knowledge/versions/{versionID}:
    parameters: [{ name: versionID, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [knowledge]
      summary: Any version with its content and sources
      description: Editors only (role `administrator`); others get 403. 
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeVersion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [knowledge]
      summary: Replace a draft's content (`revision` required; `locale` is ignored)
      description: Editors only (role `administrator`); others get 403. Only the draft's author (403 `not_author`; another editor creates a new version instead) and only drafts (a submitted version is frozen, also by a database trigger). A recommendation may not claim more than the version (422 `stronger_than_version`). Audited.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeVersionInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_draft` or `version_conflict`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/knowledge/versions/{versionID}/submit:
    parameters: [{ name: versionID, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [knowledge]
      summary: Send a draft to review (its content is frozen from now on)
      description: Editors only (role `administrator`); others get 403. Only the author (403 `not_author`); an `established` version needs a source (422 `source_required`). Audited.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: In review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeVersion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_draft`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/admin/knowledge/versions/{versionID}/publish:
    parameters: [{ name: versionID, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [knowledge]
      summary: Publish a version in review
      description: |
        Editors only (role `administrator`); others get 403. Needs an editor other than the
        author (409 `own_review`; 409 `author_unknown` when the author's account was erased);
        an `established` version must cite a source (422 `source_required`); an older version
        can't replace a newer published one (409 `newer_version_live`). The previous live
        version of the same article and locale is retired. Every decision is kept in
        `reviews`. Audited.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: [string, "null"], maxLength: 2000 }
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_in_review`, `own_review`, `author_unknown`, `newer_version_live` or `article_retired`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/knowledge/versions/{versionID}/reject:
    parameters: [{ name: versionID, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [knowledge]
      summary: Send a version in review back to draft with a note (required)
      description: Editors only (role `administrator`); others get 403. Needs an editor other than the author. Audited.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: [string, "null"], maxLength: 2000 }
      responses:
        "200":
          description: Back to draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_in_review` or `own_review`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/tanks/{tankID}/assessments:
    parameters: [{ $ref: "#/components/parameters/TankID" }]
    get:
      tags: [intelligence]
      summary: The tank's assessments, newest first, without findings (owner or viewer)
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of assessments.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Assessment" } }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [intelligence]
      summary: Run a provisional assessment now (owner; 20 per hour)
      description: |
        Deterministic rules over the tank's last 90 days (docs/knowledge-engine.md). The result is a
        provisional assessment, never a diagnosis; it never acts on equipment or dosing. Every
        observation cites stored facts (`evidence`), hypotheses list supporting and contradicting
        facts, and cited knowledge is an exact published version. Thresholds are provisional
        (`provisional: true`) until the domain reviewer confirms them. New water tests are also
        assessed automatically (trigger `water_test`; one per tank per 10 minutes, ≤ 24 per day).
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "201":
          description: The assessment with its findings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tank_archived` or `snapshot_too_large`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/assessments/{assessmentID}:
    parameters:
      - name: assessmentID
        in: path
        required: true
        description: A malformed ID is answered like an unknown one (404).
        schema: { type: string, format: uuid }
    get:
      tags: [intelligence]
      summary: One assessment with its findings (anyone who may read its tank)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

security:
  - session: []

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-rc_session
      description: Opaque session token (HttpOnly). Named `rc_session` when served over plain http in development.

  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: The session's CSRF token (from login or the `__Host-rc_csrf` cookie).
      schema: { type: string }
    TankID:
      name: tankID
      in: path
      required: true
      description: A malformed ID is answered like an unknown one (404).
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes a create safe to retry: a retry returns the first result (header
        `Idempotent-Replayed: true`); the same key with a different request is 422
        `idempotency_key_reused`.
      schema: { type: string, minLength: 8, maxLength: 128 }
    LivestockEntryID:
      name: entryID
      in: path
      required: true
      description: A malformed ID is answered like an unknown one (404).
      schema: { type: string, format: uuid }
    EquipmentID:
      name: equipmentID
      in: path
      required: true
      description: A malformed ID is answered like an unknown one (404).
      schema: { type: string, format: uuid }
    MaintenancePlanID:
      name: planID
      in: path
      required: true
      description: A malformed ID is answered like an unknown one (404).
      schema: { type: string, format: uuid }
    DosingPlanID:
      name: planID
      in: path
      required: true
      description: A malformed ID is answered like an unknown one (404).
      schema: { type: string, format: uuid }
    WaterChangeID:
      name: eventID
      in: path
      required: true
      description: A malformed ID is answered like an unknown one (404).
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque `next_cursor` from the previous page.
      schema: { type: string }

  headers:
    SetSessionCookies:
      description: Session cookie (HttpOnly) and CSRF cookie (readable), `SameSite=Lax`, `Secure` and `__Host-` prefixed over https.
      schema: { type: string }

  responses:
    Accepted:
      description: Accepted.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Status" }
    BadRequest:
      description: "`malformed_json` (with the field when known), `unknown_field`, `invalid_query`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: "`unauthenticated` or `invalid_credentials`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`csrf_failed`, `account_suspended`, `forbidden`, `email_not_verified`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`: the resource does not exist or the caller may not see it."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: "`validation_failed` with per-field `details`, or a domain error such as `invalid_token`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited`"
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Busy:
      description: "`server_busy`: too many concurrent password hashes; retry shortly."
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Exact decimal as a string. Responses are canonical (no trailing zeros).
      examples: ["60", "25.5"]
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { enum: [ok, fail] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: Stable machine-readable code; clients localize by it. }
            message: { type: string, description: English fallback text. }
            details:
              type: array
              items:
                type: object
                required: [code]
                properties:
                  field: { type: string, examples: ["dimensions_cm.width"] }
                  code: { type: string }
                  params: { type: object, additionalProperties: { type: string } }
            request_id: { type: string }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
        display_name: { type: string, minLength: 1, maxLength: 60 }
        locale: { enum: [vi, en], default: vi }
        timezone: { type: string, default: Asia/Ho_Chi_Minh, description: IANA time zone name }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token: { type: string }
    UnitPrefs:
      type: object
      additionalProperties: false
      description: Display units only; stored measurements keep their original value and unit.
      properties:
        volume: { enum: [L, gal_us] }
        length: { enum: [cm, in] }
        temperature: { enum: [C, F] }
        alkalinity: { enum: [dKH, meq/L, ppm CaCO3] }
        salinity: { enum: [SG, ppt] }
    NotificationPrefs:
      type: object
      additionalProperties: false
      description: |
        `email_*`: opt-in email channels (default off; email needs a verified address).
        `reminders_<category>`: in-app reminders per category (default on). Security emails
        cannot be turned off. `email_assessments` and `email_digest` are reserved.
      properties:
        email_reminders: { type: boolean }
        email_assessments: { type: boolean }
        email_digest: { type: boolean }
        reminders_dosing: { type: boolean }
        reminders_water_change: { type: boolean }
        reminders_maintenance: { type: boolean }
    User:
      type: object
      required: [id, email, email_verified, display_name, username, bio, experience_level, locale, timezone,
                 unit_prefs, notification_prefs, roles, created_at, version]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified: { type: boolean }
        display_name: { type: string }
        username: { type: [string, "null"] }
        bio: { type: [string, "null"] }
        experience_level: { enum: [beginner, intermediate, advanced, professional, null] }
        locale: { enum: [vi, en] }
        timezone: { type: string }
        unit_prefs: { $ref: "#/components/schemas/UnitPrefs" }
        notification_prefs: { $ref: "#/components/schemas/NotificationPrefs" }
        roles: { type: array, items: { enum: [moderator, administrator] } }
        created_at: { type: string, format: date-time }
        version: { type: integer }
    ProfilePatch:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer }
        display_name: { type: string, minLength: 1, maxLength: 60 }
        username: { type: [string, "null"], pattern: '^[a-z0-9_]{3,30}$', description: Lower-cased before validation. }
        bio: { type: [string, "null"], maxLength: 1000 }
        experience_level: { enum: [beginner, intermediate, advanced, professional, null] }
        locale: { enum: [vi, en] }
        timezone: { type: string }
        unit_prefs:
          type: [object, "null"]
          additionalProperties: false
          properties:
            volume: { enum: [L, gal_us, null] }
            length: { enum: [cm, in, null] }
            temperature: { enum: [C, F, null] }
            alkalinity: { enum: [dKH, meq/L, ppm CaCO3, null] }
            salinity: { enum: [SG, ppt, null] }
        notification_prefs:
          type: [object, "null"]
          additionalProperties: false
          properties:
            email_reminders: { type: [boolean, "null"] }
            email_assessments: { type: [boolean, "null"] }
            email_digest: { type: [boolean, "null"] }
            reminders_dosing: { type: [boolean, "null"] }
            reminders_water_change: { type: [boolean, "null"] }
            reminders_maintenance: { type: [boolean, "null"] }
    TankType:
      enum: [fish_only, fowlr, mixed_reef, sps_dominant, lps_dominant, soft_coral, custom]
    Dimensions:
      type: object
      additionalProperties: false
      required: [length, width, height]
      description: Inside dimensions in cm; each > 0, at most 6 integer digits and 1 decimal.
      properties:
        length: { $ref: "#/components/schemas/Decimal" }
        width: { $ref: "#/components/schemas/Decimal" }
        height: { $ref: "#/components/schemas/Decimal" }
    Tank:
      type: object
      required: [id, owner_id, access, name, description, tank_type, status, dimensions_cm, display_volume_l,
                 sump_volume_l, system_volume_l, setup_date, water_source, salt_mix, archived_at, created_at,
                 updated_at, version]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        access: { enum: [owner, viewer], description: The caller's access to this tank. }
        name: { type: string }
        description: { type: [string, "null"] }
        tank_type: { $ref: "#/components/schemas/TankType" }
        status: { enum: [cycling, active, paused, archived] }
        dimensions_cm:
          oneOf:
            - { $ref: "#/components/schemas/Dimensions" }
            - { type: "null" }
        display_volume_l: { $ref: "#/components/schemas/Decimal" }
        sump_volume_l:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        system_volume_l:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Estimated total water volume, entered by the keeper. Calculations use it and label it as an estimate.
        setup_date: { type: [string, "null"], format: date }
        water_source: { type: [string, "null"] }
        salt_mix: { type: [string, "null"] }
        archived_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    TankCreate:
      type: object
      additionalProperties: false
      required: [name, tank_type, display_volume_l, system_volume_l]
      description: |
        Volumes are > 0 (sump ≥ 0) with at most 7 integer digits and 2 decimals. A system volume
        smaller than the display volume is accepted (rock displacement); clients should warn.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, "null"], maxLength: 4000 }
        tank_type: { $ref: "#/components/schemas/TankType" }
        status: { enum: [cycling, active, paused], default: cycling }
        dimensions_cm:
          oneOf:
            - { $ref: "#/components/schemas/Dimensions" }
            - { type: "null" }
        display_volume_l: { $ref: "#/components/schemas/Decimal" }
        sump_volume_l:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        system_volume_l: { $ref: "#/components/schemas/Decimal" }
        setup_date: { type: [string, "null"], format: date, description: "1950-01-01 to tomorrow (UTC)" }
        water_source: { type: [string, "null"], maxLength: 100 }
        salt_mix: { type: [string, "null"], maxLength: 100 }
    TankPatch:
      type: object
      additionalProperties: false
      required: [version]
      description: |
        Merge patch. `null` clears optional fields; required fields reject `null`. Status
        `archived` is only reachable via the archive action. `dimensions_cm` is replaced as a
        whole (all three members required), not merged member by member. A stale `version`
        gets 409 before any validation.
      properties:
        version: { type: integer }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, "null"], maxLength: 4000 }
        tank_type: { $ref: "#/components/schemas/TankType" }
        status: { enum: [cycling, active, paused] }
        dimensions_cm:
          oneOf:
            - { $ref: "#/components/schemas/Dimensions" }
            - { type: "null" }
        display_volume_l: { $ref: "#/components/schemas/Decimal" }
        sump_volume_l:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        system_volume_l: { $ref: "#/components/schemas/Decimal" }
        setup_date: { type: [string, "null"], format: date }
        water_source: { type: [string, "null"], maxLength: 100 }
        salt_mix: { type: [string, "null"], maxLength: 100 }
    Share:
      type: object
      required: [user_id, display_name, username, permission, created_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        username: { type: [string, "null"] }
        permission: { const: viewer }
        created_at: { type: string, format: date-time }
    WaterChangeEstimate:
      type: object
      required: [fraction_of_system, system_volume_l, basis, assumptions, flags]
      description: |
        Volume exchanged relative to the tank's estimated total system volume — not a measured
        share of water replaced. 3 decimals, rounded half away from zero, never clamped
        (> 1 is possible). Clients must show the assumptions and flags with it, and show
        "< 0.1 %" when a non-zero volume rounds to 0.
      properties:
        fraction_of_system: { $ref: "#/components/schemas/Decimal" }
        system_volume_l:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: For completed changes the tank's volume at completion (history never changes); otherwise the current one.
        basis: { enum: [actual, planned] }
        assumptions:
          type: array
          items: { enum: [fraction_of_total_system, complete_mixing, system_volume_as_entered] }
        flags:
          type: array
          description: "`exceeds_system_volume` (check the volume or unit), `large_change` (> 0.5: match the new water's salinity, temperature and alkalinity closely). Never blocking."
          items: { enum: [exceeds_system_volume, large_change] }
    RRule:
      type: string
      maxLength: 200
      description: |
        Recurrence subset: `FREQ=DAILY|WEEKLY|MONTHLY`, `INTERVAL=1..365`, `BYDAY=MO,…` (weekly),
        `BYMONTHDAY=1..28,…` (monthly), `BYHOUR=0..23,…` (≤ 6, default 9), `BYMINUTE=0..59`.
        Times are wall-clock in `timezone`. Stored and returned in canonical form.
        Errors: `invalid_rrule`, `unsupported_rrule_part`.
      examples: ["FREQ=WEEKLY;BYDAY=SU;BYHOUR=9;BYMINUTE=0"]
    WaterChangeSchedule:
      type: object
      required: [id, tank_id, rrule, timezone, starts_on, ends_on, planned_volume_l, salt_mix, notes, status,
                 next_occurrences, estimate, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tank_id: { type: string, format: uuid }
        rrule: { $ref: "#/components/schemas/RRule" }
        timezone: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, "null"], format: date }
        planned_volume_l: { $ref: "#/components/schemas/Decimal" }
        salt_mix: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        status: { enum: [active, paused, ended] }
        next_occurrences: { type: array, maxItems: 3, items: { type: string, format: date-time } }
        estimate:
          oneOf:
            - { $ref: "#/components/schemas/WaterChangeEstimate" }
            - { type: "null" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    WaterChangeScheduleCreate:
      type: object
      additionalProperties: false
      required: [rrule, timezone, starts_on, planned_volume_l]
      properties:
        rrule: { $ref: "#/components/schemas/RRule" }
        timezone: { type: string, description: IANA time zone of the wall-clock times }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, "null"], format: date, description: Inclusive; not before starts_on. }
        planned_volume_l: { $ref: "#/components/schemas/Decimal" }
        salt_mix: { type: [string, "null"], maxLength: 100 }
        notes: { type: [string, "null"], maxLength: 2000 }
    WaterChangeSchedulePatch:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer }
        rrule: { $ref: "#/components/schemas/RRule" }
        timezone: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, "null"], format: date }
        planned_volume_l: { $ref: "#/components/schemas/Decimal" }
        salt_mix: { type: [string, "null"], maxLength: 100 }
        notes: { type: [string, "null"], maxLength: 2000 }
        status: { enum: [active, paused, ended] }
    WaterChange:
      type: object
      required: [id, tank_id, schedule_id, scheduled_for, planned_volume_l, status, overdue, completed_at,
                 actual_volume_l, salt_mix, notes, skip_reason, resolved_at, estimate, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tank_id: { type: string, format: uuid }
        schedule_id: { type: [string, "null"], format: uuid }
        scheduled_for: { type: [string, "null"], format: date-time }
        planned_volume_l:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        status: { enum: [scheduled, completed, skipped] }
        overdue: { type: boolean, description: "Derived: still scheduled after its grace (24 h, or half the schedule's spacing if shorter). Never auto-completed." }
        completed_at: { type: [string, "null"], format: date-time, description: When the water was changed. }
        actual_volume_l:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        salt_mix: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        skip_reason: { type: [string, "null"] }
        resolved_at: { type: [string, "null"], format: date-time, description: When the keeper completed or skipped it. }
        estimate:
          description: From actual_volume_l when completed, else planned_volume_l.
          oneOf:
            - { $ref: "#/components/schemas/WaterChangeEstimate" }
            - { type: "null" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    WaterChangeRecord:
      type: object
      additionalProperties: false
      description: Exactly one of completed_at or scheduled_for.
      properties:
        completed_at: { type: string, format: date-time, description: At most 5 min in the future. }
        actual_volume_l: { $ref: "#/components/schemas/Decimal" }
        scheduled_for: { type: string, format: date-time }
        planned_volume_l: { $ref: "#/components/schemas/Decimal" }
        salt_mix: { type: [string, "null"], maxLength: 100 }
        notes: { type: [string, "null"], maxLength: 2000 }
    DoseUnit:
      enum: [ml, l, drops, g, mg, tablets]
      description: "Must suit the product form: liquid ml/l/drops, powder g/mg or ml/l (dissolved, \"prepared solution\"), tablet tablets, other any (`incompatible_unit`). Units are never converted into each other; drop size varies by bottle."
    DosingForm:
      enum: [liquid, powder, tablet, other]
    DosingProduct:
      type: object
      required: [id, curated, name, brand, form, default_unit, notes, created_at]
      properties:
        id: { type: string, format: uuid }
        curated: { type: boolean, description: Catalog entry (true) or the caller's own product. }
        name: { type: string }
        brand: { type: [string, "null"] }
        form: { $ref: "#/components/schemas/DosingForm" }
        default_unit: { $ref: "#/components/schemas/DoseUnit" }
        notes: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    DosingProductRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: [string, "null"] }
        form: { $ref: "#/components/schemas/DosingForm" }
    DosingPlan:
      type: object
      required: [id, tank_id, product, amount, amount_unit, rrule, timezone, starts_on, ends_on, delivery_method,
                 status, notes, next_occurrences, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tank_id: { type: string, format: uuid }
        product: { $ref: "#/components/schemas/DosingProductRef" }
        amount: { $ref: "#/components/schemas/Decimal" }
        amount_unit: { $ref: "#/components/schemas/DoseUnit" }
        rrule: { $ref: "#/components/schemas/RRule" }
        timezone: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, "null"], format: date }
        delivery_method: { enum: [manual, dosing_pump], description: Recorded only; ReefCare never controls a pump. }
        status: { enum: [active, paused, completed] }
        notes: { type: [string, "null"] }
        next_occurrences: { type: array, maxItems: 3, items: { type: string, format: date-time } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    DosingPlanCreate:
      type: object
      additionalProperties: false
      required: [product_id, amount, amount_unit, rrule, timezone, starts_on]
      properties:
        product_id: { type: string, format: uuid, description: A curated product or one of the owner's own (`product_not_found`). }
        amount: { $ref: "#/components/schemas/Decimal" }
        amount_unit: { $ref: "#/components/schemas/DoseUnit" }
        rrule: { $ref: "#/components/schemas/RRule" }
        timezone: { type: string }
        starts_on: { type: string, format: date, description: "2000-01-01 to ten years ahead" }
        ends_on: { type: [string, "null"], format: date }
        delivery_method: { enum: [manual, dosing_pump], default: manual }
        notes: { type: [string, "null"], maxLength: 2000 }
    DosingPlanPatch:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer }
        amount: { $ref: "#/components/schemas/Decimal" }
        amount_unit: { $ref: "#/components/schemas/DoseUnit" }
        rrule: { $ref: "#/components/schemas/RRule" }
        timezone: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, "null"], format: date }
        delivery_method: { enum: [manual, dosing_pump] }
        notes: { type: [string, "null"], maxLength: 2000 }
    DoseEvent:
      type: object
      required: [id, tank_id, plan_id, product, scheduled_for, planned_amount, actual_amount, actual_source, deviation,
                 amount_unit, status, executed_at, reason, reason_code, notes, reported_by, missed_at, resolved_at,
                 created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tank_id: { type: string, format: uuid }
        plan_id: { type: [string, "null"], format: uuid }
        product: { $ref: "#/components/schemas/DosingProductRef" }
        scheduled_for: { type: [string, "null"], format: date-time }
        planned_amount:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        actual_amount:
          oneOf:
            - { $ref: "#/components/schemas/Decimal" }
            - { type: "null" }
        actual_source: { enum: [entered, planned_default, null] }
        deviation: { enum: [over, under, null], description: actual vs planned amount. }
        amount_unit: { $ref: "#/components/schemas/DoseUnit" }
        status:
          enum: [scheduled, completed, partial, skipped, failed, missed, unconfirmed]
          description: "Set only by the scheduler when still scheduled after min(12 h, half the plan's spacing): `missed` for manual plans, `unconfirmed` for pump plans (ReefCare cannot know whether the pump delivered). Never auto-completed."
        executed_at: { type: [string, "null"], format: date-time }
        reason: { type: [string, "null"], description: "The keeper's words." }
        reason_code: { enum: [tank_archived, plan_paused, plan_changed, null], description: System reason. }
        notes: { type: [string, "null"] }
        reported_by: { enum: [manual, device, null] }
        missed_at: { type: [string, "null"], format: date-time, description: Set when the scheduler marked it missed; kept after a later resolution. }
        resolved_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    EquipmentCategory:
      enum: [lighting, return_pump, flow_pump, skimmer, heater, chiller, dosing_pump, ato, reactor, uv, controller, filter, sensor, other]
    EquipmentSettings:
      type: object
      minProperties: 1
      maxProperties: 50
      description: Flat free-form settings (light schedule, pump speed…). Keys 1–50 characters; values strings (≤ 200), numbers or booleans. Never interpreted by ReefCare.
      additionalProperties:
        oneOf: [{ type: string, maxLength: 200 }, { type: number }, { type: boolean }]
    EquipmentConfiguration:
      type: object
      required: [id, version_no, settings, effective_at, note, created_at]
      properties:
        id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        settings: { $ref: "#/components/schemas/EquipmentSettings" }
        effective_at: { type: string, format: date-time }
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    Equipment:
      type: object
      required: [id, tank_id, category, name, manufacturer, model, serial_number, purchased_on, warranty_until,
                 installed_at, removed_at, removal_reason, notes, configuration, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tank_id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/EquipmentCategory" }
        name: { type: string }
        manufacturer: { type: [string, "null"] }
        model: { type: [string, "null"] }
        serial_number: { type: [string, "null"] }
        purchased_on: { type: [string, "null"], format: date }
        warranty_until: { type: [string, "null"], format: date }
        installed_at: { type: string, format: date-time }
        removed_at: { type: [string, "null"], format: date-time }
        removal_reason: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        configuration:
          description: The current (latest) configuration version, if any.
          oneOf:
            - { $ref: "#/components/schemas/EquipmentConfiguration" }
            - { type: "null" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    EquipmentCreate:
      type: object
      additionalProperties: false
      required: [category, name]
      properties:
        category: { $ref: "#/components/schemas/EquipmentCategory" }
        name: { type: string, minLength: 1, maxLength: 100 }
        manufacturer: { type: [string, "null"], maxLength: 100 }
        model: { type: [string, "null"], maxLength: 100 }
        serial_number: { type: [string, "null"], maxLength: 100 }
        purchased_on: { type: [string, "null"], format: date }
        warranty_until: { type: [string, "null"], format: date, description: Not before purchased_on (`before_purchase`). }
        installed_at: { type: string, format: date-time, description: Default now; not in the future. }
        notes: { type: [string, "null"], maxLength: 2000 }
    EquipmentPatch:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer }
        category: { $ref: "#/components/schemas/EquipmentCategory" }
        name: { type: string, minLength: 1, maxLength: 100 }
        manufacturer: { type: [string, "null"], maxLength: 100 }
        model: { type: [string, "null"], maxLength: 100 }
        serial_number: { type: [string, "null"], maxLength: 100 }
        purchased_on: { type: [string, "null"], format: date }
        warranty_until: { type: [string, "null"], format: date }
        notes: { type: [string, "null"], maxLength: 2000 }
    MaintenancePlan:
      type: object
      required: [id, tank_id, equipment_id, equipment_name, title, interval_days, timezone, starts_on, last_performed_at,
                 next_due_on, active, overdue, due_today, notes, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tank_id: { type: string, format: uuid }
        equipment_id: { type: [string, "null"], format: uuid }
        equipment_name: { type: [string, "null"] }
        title: { type: string }
        interval_days: { type: integer, minimum: 1, maximum: 730 }
        timezone: { type: string }
        starts_on: { type: string, format: date }
        last_performed_at: { type: [string, "null"], format: date-time }
        next_due_on: { type: string, format: date, description: "Local date: last performance + interval_days, or starts_on." }
        active: { type: boolean, description: False after archiving the tank, removing the device or deactivating the plan. }
        overdue: { type: boolean, description: "Derived: active and next_due_on has passed in `timezone`." }
        due_today: { type: boolean }
        notes: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    MaintenancePlanCreate:
      type: object
      additionalProperties: false
      required: [title, interval_days, timezone, starts_on]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        interval_days: { type: integer, minimum: 1, maximum: 730 }
        timezone: { type: string }
        starts_on: { type: string, format: date }
        equipment_id: { type: [string, "null"], format: uuid, description: "A device on the same tank that is still installed (`equipment_not_found`, `equipment_removed`)." }
        notes: { type: [string, "null"], maxLength: 2000 }
    MaintenancePlanPatch:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer }
        title: { type: string, minLength: 1, maxLength: 100 }
        interval_days: { type: integer, minimum: 1, maximum: 730 }
        timezone: { type: string }
        starts_on: { type: string, format: date }
        equipment_id: { type: [string, "null"], format: uuid }
        active: { type: boolean, description: "An active plan needs an installed device (`equipment_removed`)." }
        notes: { type: [string, "null"], maxLength: 2000 }
    MaintenanceEvent:
      type: object
      required: [id, tank_id, plan_id, equipment_id, title, performed_at, notes, created_at]
      properties:
        id: { type: string, format: uuid }
        tank_id: { type: string, format: uuid }
        plan_id: { type: [string, "null"], format: uuid }
        equipment_id: { type: [string, "null"], format: uuid }
        title: { type: string }
        performed_at: { type: string, format: date-time }
        notes: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    LivestockCategory:
      enum: [fish, coral, invertebrate, algae, other]
    CoralType:
      enum: [sps, lps, soft, non_photosynthetic]
    Species:
      type: object
      required: [id, curated, category, coral_type, common_name_vi, common_name_en, scientific_name, created_at]
      properties:
        id: { type: string, format: uuid }
        curated: { type: boolean, description: "True for the shared catalog; false for your own." }
        category: { $ref: "#/components/schemas/LivestockCategory" }
        coral_type:
          oneOf: [{ $ref: "#/components/schemas/CoralType" }, { type: "null" }]
        common_name_vi: { type: [string, "null"] }
        common_name_en: { type: [string, "null"] }
        scientific_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    SpeciesCreate:
      type: object
      additionalProperties: false
      required: [category]
      description: At least one name is required (`name_required`); `coral_type` only for corals (`coral_only`).
      properties:
        category: { $ref: "#/components/schemas/LivestockCategory" }
        coral_type:
          oneOf: [{ $ref: "#/components/schemas/CoralType" }, { type: "null" }]
        common_name_vi: { type: [string, "null"], maxLength: 100 }
        common_name_en: { type: [string, "null"], maxLength: 100 }
        scientific_name: { type: [string, "null"], maxLength: 150 }
    LivestockForm:
      enum: [individual, group, frag, colony]
    LivestockEntry:
      type: object
      required: [id, tank_id, species, category, coral_type, display_name, form, quarantine_status, location_note,
                 source_note, notes, current_quantity, present, added_at, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tank_id: { type: string, format: uuid }
        species:
          oneOf:
            - type: object
              required: [id, common_name_vi, common_name_en, scientific_name]
              properties:
                id: { type: string, format: uuid }
                common_name_vi: { type: [string, "null"] }
                common_name_en: { type: [string, "null"] }
                scientific_name: { type: [string, "null"] }
            - { type: "null" }
        category: { $ref: "#/components/schemas/LivestockCategory" }
        coral_type:
          oneOf: [{ $ref: "#/components/schemas/CoralType" }, { type: "null" }]
        display_name: { type: string }
        form:
          oneOf: [{ $ref: "#/components/schemas/LivestockForm" }, { type: "null" }]
        quarantine_status:
          oneOf: [{ enum: [in_quarantine, completed] }, { type: "null" }]
        location_note: { type: [string, "null"] }
        source_note: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        current_quantity:
          type: integer
          minimum: 0
          description: Sum of the entry's event deltas. A colony, a frag plug or a rock of zoanthids counts as 1.
        present: { type: boolean, description: "current_quantity > 0; a gone group stays in history." }
        added_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    LivestockEntryCreate:
      type: object
      additionalProperties: false
      required: [display_name, quantity]
      properties:
        species_id: { type: [string, "null"], format: uuid, description: "Curated or your own (`species_not_found`)." }
        category:
          description: Defaults to the species' category; required without a species (`species_mismatch` if it differs).
          oneOf: [{ $ref: "#/components/schemas/LivestockCategory" }, { type: "null" }]
        display_name: { type: string, minLength: 1, maxLength: 100 }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        added_at: { type: string, format: date-time, description: Default now; not in the future. }
        form:
          oneOf: [{ $ref: "#/components/schemas/LivestockForm" }, { type: "null" }]
        coral_type:
          description: Corals only (`coral_only`); defaults to the species' coral type (`species_mismatch` if it differs).
          oneOf: [{ $ref: "#/components/schemas/CoralType" }, { type: "null" }]
        quarantine_status:
          oneOf: [{ enum: [in_quarantine, completed] }, { type: "null" }]
        location_note: { type: [string, "null"], maxLength: 200 }
        source_note: { type: [string, "null"], maxLength: 200 }
        notes: { type: [string, "null"], maxLength: 2000 }
    LivestockEntryPatch:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer }
        species_id: { type: [string, "null"], format: uuid, description: "Changing it alone takes the species' category." }
        category: { $ref: "#/components/schemas/LivestockCategory" }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        form:
          oneOf: [{ $ref: "#/components/schemas/LivestockForm" }, { type: "null" }]
        coral_type:
          description: Corals only (`coral_only`); defaults to the species' coral type (`species_mismatch` if it differs).
          oneOf: [{ $ref: "#/components/schemas/CoralType" }, { type: "null" }]
        quarantine_status:
          oneOf: [{ enum: [in_quarantine, completed] }, { type: "null" }]
        location_note: { type: [string, "null"], maxLength: 200 }
        source_note: { type: [string, "null"], maxLength: 200 }
        notes: { type: [string, "null"], maxLength: 2000 }
    LivestockEvent:
      type: object
      required: [id, entry_id, type, quantity_delta, occurred_at, note, created_at]
      properties:
        id: { type: string, format: uuid }
        entry_id: { type: string, format: uuid }
        type: { enum: [added, transferred_in, propagated, found, died, missing, transferred_out, sold, reconciliation, health_observation, treatment] }
        quantity_delta: { type: integer, description: "Positive for additions, negative for losses, 0 for observations." }
        occurred_at: { type: string, format: date-time }
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    ParameterType:
      type: object
      required: [code, canonical_unit, units, hard_min, hard_max, freshness_hours, decimals]
      properties:
        code: { type: string, example: alkalinity }
        canonical_unit: { type: string, example: dKH }
        units:
          type: array
          items:
            type: object
            required: [code, estimate]
            properties:
              code: { type: string, example: "meq/L" }
              estimate: { type: boolean }
        hard_min: { $ref: "#/components/schemas/Decimal" }
        hard_max: { $ref: "#/components/schemas/Decimal" }
        freshness_hours: { type: integer, description: Default age after which the latest reading counts as stale. }
        decimals: { type: integer, description: Canonical values are rounded to this many places. }
    ReadingInput:
      type: object
      additionalProperties: false
      required: [parameter, value, unit]
      properties:
        parameter: { type: string }
        value: { $ref: "#/components/schemas/Decimal" }
        unit: { type: string, description: One of the parameter's units; unknown units are rejected. }
        method:
          oneOf:
            - enum: [titration, colorimetric, photometer, refractometer, hydrometer, probe, icp, other]
            - { type: "null" }
        test_kit: { type: [string, "null"], maxLength: 100 }
    WaterTestCreate:
      type: object
      additionalProperties: false
      required: [readings]
      properties:
        measured_at: { type: [string, "null"], format: date-time, description: Default now; at most 5 minutes in the future. }
        notes: { type: [string, "null"], maxLength: 2000 }
        readings: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/ReadingInput" } }
    Reading:
      type: object
      required: [id, parameter, measured_at, input_value, input_unit, canonical_value, canonical_unit, estimate, method,
                 test_kit, status, supersedes_id, correction_reason, target_status, warnings, created_at]
      properties:
        id: { type: string, format: uuid }
        parameter: { type: string }
        measured_at: { type: string, format: date-time }
        input_value: { $ref: "#/components/schemas/Decimal" }
        input_unit: { type: string }
        canonical_value: { $ref: "#/components/schemas/Decimal" }
        canonical_unit: { type: string }
        estimate: { type: boolean, description: Converted with an assumption (e.g. specific gravity at 25 °C). }
        method: { type: [string, "null"] }
        test_kit: { type: [string, "null"] }
        status: { enum: [valid, superseded] }
        supersedes_id: { type: [string, "null"], format: uuid }
        correction_reason: { type: [string, "null"] }
        target_status:
          oneOf:
            - enum: [below, within, above]
            - { type: "null" }
          description: |
            Compared with the target valid at `measured_at`; null when no target with a min or
            max was in effect then (e.g. a test backdated to before the target was set).
        warnings:
          type: array
          items: { type: string }
          description: "Soft hints, e.g. `looks_like_specific_gravity`, `unusually_high`; new codes may appear."
        created_at: { type: string, format: date-time }
    WaterTest:
      type: object
      required: [id, tank_id, measured_at, source, notes, readings, created_at]
      properties:
        id: { type: string, format: uuid }
        tank_id: { type: string, format: uuid }
        measured_at: { type: string, format: date-time }
        source: { enum: [manual, imported, sensor] }
        notes: { type: [string, "null"] }
        readings: { type: array, items: { $ref: "#/components/schemas/Reading" } }
        created_at: { type: string, format: date-time }
    Target:
      type: object
      required: [parameter, min, ideal, max, freshness_hours, valid_from, valid_to]
      properties:
        parameter: { type: string }
        min: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        ideal: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        max: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        freshness_hours: { type: [integer, "null"] }
        valid_from: { type: string, format: date-time }
        valid_to: { type: [string, "null"], format: date-time }
    TargetInput:
      type: object
      additionalProperties: false
      required: [parameter]
      description: At least one of min, ideal, max, freshness_hours; min ≤ ideal ≤ max; values in the canonical unit.
      properties:
        parameter: { type: string }
        min: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        ideal: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        max: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        freshness_hours: { type: [integer, "null"], minimum: 1, maximum: 8760 }
    TargetList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Target" } }
        next_cursor: { type: "null" }
    LatestReading:
      type: object
      required: [parameter, canonical_unit, reading, freshness_hours, stale, target]
      properties:
        parameter: { type: string }
        canonical_unit: { type: string }
        reading:
          oneOf: [{ $ref: "#/components/schemas/Reading" }, { type: "null" }]
          description: Its `target_status` compares the value with the current `target` (not the one in effect when measured).
        freshness_hours: { type: integer, description: The target's freshness or the catalog default. }
        stale: { type: boolean, description: No reading, or the newest is older than `freshness_hours`. }
        target: { oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }] }
    Trends:
      type: object
      required: [from, to, series, annotations, truncated, annotations_truncated]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        series:
          type: array
          items:
            type: object
            required: [parameter, unit, points, targets, truncated]
            properties:
              parameter: { type: string }
              unit: { type: string, description: The canonical unit of every point. }
              points:
                type: array
                items:
                  type: object
                  required: [t, v, reading_id, estimate]
                  properties:
                    t: { type: string, format: date-time }
                    v: { $ref: "#/components/schemas/Decimal" }
                    reading_id: { type: string, format: uuid }
                    estimate: { type: boolean }
              targets: { type: array, items: { $ref: "#/components/schemas/Target" }, description: Versions overlapping the range. }
              truncated: { type: boolean, description: More than 3000 points in the range; only the newest 3000 are returned. }
        annotations:
          type: array
          description: Dosing, water-change and equipment timeline events in the range, oldest first (the newest 500).
          items:
            type: object
            required: [t, category, event_type, summary]
            properties:
              t: { type: string, format: date-time }
              category: { $ref: "#/components/schemas/TimelineCategory" }
              event_type: { type: string }
              summary: { type: object, additionalProperties: true }
        truncated: { type: boolean, description: Some series were truncated; narrow the range. }
        annotations_truncated: { type: boolean, description: More than 500 events; the oldest were left out. }
    TimelineCategory:
      enum: [measurement, dosing, water_change, equipment, maintenance, livestock, symptom, treatment, milestone, note, assessment]
    TimelineEvent:
      type: object
      required: [id, occurred_at, category, event_type, source, actor, summary]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        category: { $ref: "#/components/schemas/TimelineCategory" }
        event_type: { type: string, example: "livestock.died", description: "`<module>.<what>`; new types may appear." }
        source:
          type: object
          required: [type, id]
          description: The record that caused the event (e.g. `livestock_event`, `water_change_event`).
          properties:
            type: { type: string }
            id: { type: string, format: uuid }
        actor:
          description: Who recorded it; null for the system (scheduled jobs).
          oneOf:
            - type: object
              required: [id, display_name]
              properties:
                id: { type: string, format: uuid }
                display_name: { type: string }
            - { type: "null" }
        summary: { type: object, additionalProperties: true }
    Notification:
      type: object
      required: [id, tank_id, category, kind, payload, occurred_at, read_at, created_at]
      properties:
        id: { type: string, format: uuid }
        tank_id: { type: [string, "null"], format: uuid }
        category: { enum: [dosing, water_change, maintenance] }
        kind:
          type: string
          description: "`dosing.missed`, `water_change.upcoming`, `water_change.overdue`, `maintenance.due`, `maintenance.overdue`; new kinds may appear."
        payload:
          type: object
          additionalProperties: true
          description: |
            Render-ready parameters, e.g. `tank_name`, `product_name`, `amount`, `unit`,
            `scheduled_for` (UTC), `volume_l`, `title`, `due_on` (date in the plan's zone),
            `equipment_name`.
        occurred_at: { type: string, format: date-time, description: When the work was due or missed. }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    KnowledgeCategory:
      enum: [water_chemistry, testing, dosing, livestock_health, equipment, maintenance, general]
    ClaimClass:
      description: "`established` (documented science or manufacturer data), `expert` (reviewed interpretation), `community` (reported experience), `unverified` (hypothesis). Only the first two back recommendations."
      enum: [established, expert, community, unverified]
    KnowledgeSource:
      type: object
      required: [id, title, publisher, url, published_on, accessed_on]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        publisher: { type: [string, "null"] }
        url: { type: [string, "null"] }
        published_on: { type: [string, "null"], format: date }
        accessed_on: { type: [string, "null"], format: date }
        note: { type: string, description: What the version cites from it (in a version's sources). }
    KnowledgeSourceCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        publisher: { type: [string, "null"], maxLength: 200 }
        url: { type: [string, "null"], maxLength: 1000, description: https only }
        published_on: { type: [string, "null"], format: date }
        accessed_on: { type: [string, "null"], format: date }
    KnowledgeArticle:
      type: object
      required: [id, slug, category, created_at, retired_at, latest]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        category: { $ref: "#/components/schemas/KnowledgeCategory" }
        created_at: { type: string, format: date-time }
        retired_at: { type: [string, "null"], format: date-time }
        latest:
          type: array
          items:
            type: object
            required: [id, locale, version_no, title, status, updated_at]
            properties:
              id: { type: string, format: uuid }
              locale: { enum: [vi, en] }
              version_no: { type: integer }
              title: { type: string }
              status: { $ref: "#/components/schemas/KnowledgeStatus" }
              updated_at: { type: string, format: date-time }
    KnowledgeStatus:
      enum: [draft, in_review, published, retired]
    KnowledgeItem:
      type: object
      additionalProperties: false
      required: [key, text]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{1,59}$" }
        text: { type: string, minLength: 1, maxLength: 500 }
    KnowledgeStructured:
      type: object
      additionalProperties: false
      description: Typed lists rules refer to by key (at most 20 each).
      properties:
        verifications: { type: array, items: { $ref: "#/components/schemas/KnowledgeItem" } }
        recommendations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, text, claim_class]
            properties:
              key: { type: string, pattern: "^[a-z][a-z0-9_]{1,59}$" }
              text: { type: string, minLength: 1, maxLength: 500 }
              claim_class: { $ref: "#/components/schemas/ClaimClass" }
        contraindications: { type: array, items: { $ref: "#/components/schemas/KnowledgeItem" } }
        safety_warnings: { type: array, items: { $ref: "#/components/schemas/KnowledgeItem" } }
    KnowledgeVersionInput:
      type: object
      additionalProperties: false
      required: [title, summary, body_md, claim_class]
      properties:
        revision: { type: integer, description: Required when editing a draft. }
        locale: { enum: [vi, en], description: Required when creating. }
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        body_md: { type: string, minLength: 1, maxLength: 50000, description: Markdown; clients render it as untrusted text (no raw HTML). }
        claim_class: { $ref: "#/components/schemas/ClaimClass" }
        parameters: { type: array, maxItems: 20, items: { type: string }, description: Parameter catalog codes. }
        symptoms: { type: array, maxItems: 20, items: { type: string, pattern: "^[a-z][a-z0-9_]{1,59}$" } }
        structured: { $ref: "#/components/schemas/KnowledgeStructured" }
        sources:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [source_id]
            properties:
              source_id: { type: string, format: uuid }
              note: { type: [string, "null"], maxLength: 300 }
    KnowledgeVersion:
      type: object
      required: [id, locale, version_no, title, summary, claim_class, parameters, symptoms, status, published_at]
      description: Readers get published content only; editor-only fields (author, review, revision) are omitted for them.
      properties:
        id: { type: string, format: uuid }
        article_id: { type: string, format: uuid }
        slug: { type: string }
        category: { $ref: "#/components/schemas/KnowledgeCategory" }
        locale: { enum: [vi, en] }
        version_no: { type: integer }
        title: { type: string }
        summary: { type: string }
        body_md: { type: string }
        claim_class: { $ref: "#/components/schemas/ClaimClass" }
        parameters: { type: array, items: { type: string } }
        symptoms: { type: array, items: { type: string } }
        structured: { $ref: "#/components/schemas/KnowledgeStructured" }
        status: { $ref: "#/components/schemas/KnowledgeStatus" }
        author_id: { type: string, format: uuid }
        reviewed_by: { type: string, format: uuid }
        review_note: { type: string }
        submitted_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
        published_at: { type: [string, "null"], format: date-time }
        retired_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        revision: { type: integer }
        sources: { type: array, items: { $ref: "#/components/schemas/KnowledgeSource" } }
        reviews:
          type: array
          description: Review history (editors only).
          items:
            type: object
            required: [reviewer_id, decision, note, at]
            properties:
              reviewer_id: { type: [string, "null"], format: uuid }
              decision: { enum: [rejected, published] }
              note: { type: [string, "null"] }
              at: { type: string, format: date-time }
    I18nText:
      type: object
      required: [key]
      description: An i18n key with parameters; clients localize it (unknown keys render generically).
      properties:
        key: { type: string }
        params: { type: object, additionalProperties: { type: string } }
    EvidenceRef:
      type: object
      required: [kind, id]
      properties:
        kind: { enum: [reading, dosing_event, water_change, equipment_change, livestock_event] }
        id: { type: string, format: uuid }
    Hypothesis:
      type: object
      required: [key, text, claim_class, correlation, supporting, contradicting, missing]
      properties:
        key: { type: string }
        text: { $ref: "#/components/schemas/I18nText" }
        claim_class: { type: string, description: "Of the knowledge behind it; empty for rule-derived links." }
        correlation: { type: boolean, description: A temporal coincidence, never a proven cause. }
        supporting: { type: array, items: { $ref: "#/components/schemas/EvidenceRef" } }
        contradicting: { type: array, items: { $ref: "#/components/schemas/EvidenceRef" } }
        missing: { type: array, items: { $ref: "#/components/schemas/MissingItem" } }
    MissingItem:
      type: object
      required: [text]
      properties:
        text: { $ref: "#/components/schemas/I18nText" }
        parameter: { type: string }
    Finding:
      type: object
      required: [rule_id, type, severity, summary, observations, hypotheses, alternative_explanations, missing_information,
                 recommended_verifications, safety_warnings, knowledge_references, confidence_label]
      properties:
        rule_id: { type: string, example: NH-AMMONIA-NITRITE }
        type: { enum: [data_quality, parameter_deviation, parameter_instability, dosing_mismatch, livestock_change, next_measurements] }
        severity: { enum: [info, notice, warning, urgent] }
        parameter: { type: string }
        summary: { $ref: "#/components/schemas/I18nText" }
        observations:
          type: array
          items:
            type: object
            required: [text, evidence]
            properties:
              text: { $ref: "#/components/schemas/I18nText" }
              evidence: { type: array, minItems: 1, items: { $ref: "#/components/schemas/EvidenceRef" } }
        hypotheses: { type: array, items: { $ref: "#/components/schemas/Hypothesis" } }
        alternative_explanations:
          type: array
          description: From community or unverified knowledge, shown as "things others have reported".
          items: { $ref: "#/components/schemas/Hypothesis" }
        missing_information: { type: array, items: { $ref: "#/components/schemas/MissingItem" } }
        recommended_verifications:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: { $ref: "#/components/schemas/I18nText" }
              parameter: { type: string }
        safety_warnings:
          type: array
          description: Always shown; urgent ones first. Never removed by later steps.
          items:
            type: object
            required: [text, urgent]
            properties:
              text: { $ref: "#/components/schemas/I18nText" }
              urgent: { type: boolean }
        knowledge_references:
          type: array
          items:
            type: object
            required: [slug, version_id, title, locale]
            properties:
              slug: { type: string }
              version_id: { type: string, format: uuid }
              title: { type: string }
              locale: { enum: [vi, en] }
        confidence_label: { enum: [not_assessed, low, moderate, high] }
    Assessment:
      type: object
      required: [id, tank_id, trigger, water_test_id, status, finding_count, max_severity, confidence_label, rule_version,
                 provisional, created_at]
      properties:
        id: { type: string, format: uuid }
        tank_id: { type: string, format: uuid }
        trigger: { enum: [manual, water_test, scheduled] }
        water_test_id: { type: [string, "null"], format: uuid }
        status: { enum: [generated, retracted] }
        finding_count: { type: integer }
        max_severity: { oneOf: [{ enum: [info, notice, warning, urgent] }, { type: "null" }] }
        confidence_label:
          description: "Lowest among assessed findings. Basis: low = one reading, a contradiction or a doubtful input; moderate = ≥ 2 fresh agreeing readings; high = moderate confirmed by a second known kit or method. Never a probability."
          enum: [not_assessed, low, moderate, high]
        rule_version: { type: string }
        provisional: { type: boolean, description: Rule thresholds not yet confirmed by the domain reviewer. }
        knowledge_version: { type: string }
        input_snapshot_version: { type: integer }
        locale: { enum: [vi, en] }
        retracted_at: { type: string, format: date-time }
        retract_reason: { type: string }
        created_at: { type: string, format: date-time }
        findings: { type: array, description: Only in single-assessment responses., items: { $ref: "#/components/schemas/Finding" } }
