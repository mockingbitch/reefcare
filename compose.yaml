# Local development environment. Not for production (see docs/architecture.md §7).
# Host ports live in the 4000 range so they don't clash with other local projects:
#   4000 API · 4001 web dev server (make web-dev) · 4002 PostgreSQL · 4003 Mailpit UI ·
#   4004 Mailpit SMTP · 4010/4011 Playwright e2e (API/web). Container ports are unchanged.
# Override with API_PORT, POSTGRES_PORT, MAILPIT_UI_PORT, MAILPIT_SMTP_PORT if needed.
name: reefcare

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: reefcare
      POSTGRES_PASSWORD: reefcare
      POSTGRES_DB: reefcare
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-4002}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
      - ./deploy/dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reefcare -d reefcare"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-4003}:8025" # web UI
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-4004}:1025" # SMTP

  migrate:
    build: .
    command: ["migrate", "up"]
    environment: &api-env
      APP_ENV: development
      DATABASE_URL: postgres://reefcare:reefcare@db:5432/reefcare?sslmode=disable
      LOG_FORMAT: text
      LOG_LEVEL: debug
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["serve"]
    environment:
      <<: *api-env
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090" # internal only: not published to the host
      # Email links point at the SvelteKit dev server, which proxies /api to this API
      # (web/vite.config.ts), so the browser sees a single origin.
      PUBLIC_BASE_URL: http://localhost:4001
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: ReefCare <no-reply@reefcare.local>
    ports:
      - "127.0.0.1:${API_PORT:-4000}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
